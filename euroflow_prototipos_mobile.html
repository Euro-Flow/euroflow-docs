<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EuroFlow — 6 Telas</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(145deg,#060E1A 0%,#0D1F2D 40%,#091A0E 100%);min-height:100vh;font-family:'Sora',sans-serif;padding:40px 20px;}
::-webkit-scrollbar{display:none;}
input,button,textarea{font-family:inherit;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.8)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:.15;transform:scale(1.22)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes streakIn{from{width:0}to{width:var(--w)}}
@keyframes notifDrop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
.f-up{animation:fadeUp .45s cubic-bezier(.34,1.2,.64,1) both}
.pop{animation:pop .4s cubic-bezier(.34,1.5,.64,1) both}
.float{animation:float 3.4s ease-in-out infinite}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.d4{animation-delay:.32s}.d5{animation-delay:.40s}.d6{animation-delay:.48s}
.card-hover{transition:transform .18s,box-shadow .18s;}
.card-hover:hover{transform:translateY(-2px);}

.page-title{color:#fff;font-size:28px;font-weight:800;text-align:center;margin-bottom:8px;letter-spacing:-.5px;}
.page-sub{color:rgba(255,255,255,.45);font-size:14px;text-align:center;font-family:'DM Sans',sans-serif;margin-bottom:48px;}
.screens-grid{display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start;}
.screen-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;}
.screen-label{color:rgba(255,255,255,.5);font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;font-family:'DM Sans',sans-serif;}
.screen-num{background:rgba(245,200,0,.15);color:#F5C800;border:1px solid rgba(245,200,0,.3);width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-bottom:4px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

// ── DESIGN TOKENS ──
const T={
  navy:"#003087",navyDark:"#001F5B",navyMid:"#004AAD",
  blue:"#0066CC",blueLight:"#E8F0FB",blueMid:"#1A7FD4",
  gold:"#F5C800",goldDark:"#C9A200",goldLight:"#FFFBE6",goldGlow:"#F5C80033",
  slate:"#F0F4FB",card:"#FFFFFF",text:"#001F5B",sub:"#5A6A8A",
  border:"#D6E2F5",shadow:"rgba(0,48,135,0.10)",
  coral:"#FF6B6B",emeraldGlow:"#003087",
};

// ── MASCOT ──
const FACES={
  happy:{emoji:"😊",grad:`${T.navy},${T.navyMid}`,glow:T.navy},
  thinking:{emoji:"🤔",grad:`${T.navyMid},${T.blue}`,glow:T.blue},
  celebrating:{emoji:"🎉",grad:`${T.gold},${T.goldDark}`,glow:T.gold},
  guardian:{emoji:"🛡️",grad:`${T.navy},${T.navyDark}`,glow:T.navyMid},
  waving:{emoji:"👋",grad:`${T.navyMid},${T.navy}`,glow:T.blue},
  idea:{emoji:"💡",grad:`${T.gold},${T.navyMid}`,glow:T.gold},
};
function Mascot({mood="happy",size=64,pulse=false,float:fl=false,style:sx={}}){
  const f=FACES[mood]||FACES.happy;
  const[g1,g2]=f.grad.split(",");
  return(
    <div className={fl?"float":""} style={{width:size,height:size,position:"relative",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,...sx}}>
      {pulse&&<div style={{position:"absolute",inset:-6,borderRadius:"50%",background:f.glow+"28",animation:"pulse 2.4s ease-in-out infinite"}}/>}
      <div style={{width:size,height:size,borderRadius:"50%",background:`radial-gradient(circle at 32% 32%,${g1}EE,${g2}99)`,boxShadow:`0 6px 24px ${f.glow}55,inset 0 -3px 10px rgba(0,0,0,.14)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.46,border:`2.5px solid ${f.glow}44`,position:"relative",zIndex:1}}>{f.emoji}</div>
    </div>
  );
}

// ── PHONE FRAME ──
function Phone({children,bar="#0A2540"}){
  return(
    <div style={{width:393,height:820,background:T.card,borderRadius:52,overflow:"hidden",flexShrink:0,boxShadow:"0 56px 100px rgba(0,0,0,.6),0 0 0 11px #252E3D,0 0 0 14px #181E28",display:"flex",flexDirection:"column",position:"relative"}}>
      <div style={{background:bar,padding:"13px 24px 5px",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,transition:"background .4s"}}>
        <span style={{color:"rgba(255,255,255,.8)",fontSize:12,fontWeight:700,fontFamily:"Sora,sans-serif"}}>9:41</span>
        <div style={{width:90,height:20,background:"rgba(0,0,0,.4)",borderRadius:14,position:"absolute",left:"50%",transform:"translateX(-50%)"}}/>
        <span style={{color:"rgba(255,255,255,.8)",fontSize:11}}>📶 🔋</span>
      </div>
      <div style={{flex:1,overflow:"hidden",position:"relative"}}>{children}</div>
    </div>
  );
}

// ── BOTTOM NAV ──
function Nav({active,onChange}){
  const tabs=[
    {id:"home",icon:"🏠",label:"Início"},
    {id:"chat",icon:"💬",label:"Euro IA"},
    {id:"explorer",icon:"🚀",label:"Explorer"},
    {id:"docs",icon:"📚",label:"Documentos"},
    {id:"profile",icon:"👤",label:"Perfil"},
  ];
  return(
    <div style={{height:70,background:T.card,borderTop:`1px solid ${T.border}`,display:"flex",flexShrink:0,boxShadow:"0 -4px 20px rgba(10,37,64,.06)"}}>
      {tabs.map(t=>{
        const on=active===t.id;
        return(
          <button key={t.id} onClick={()=>onChange(t.id)} style={{flex:1,border:"none",background:"transparent",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,cursor:"pointer",position:"relative",transition:"all .18s"}}>
            {on&&<div style={{position:"absolute",top:0,left:"22%",right:"22%",height:3,background:T.gold,borderRadius:"0 0 6px 6px"}}/>}
            <span style={{fontSize:20,filter:on?"none":"grayscale(55%)",transform:on?"scale(1.15)":"scale(1)",transition:"transform .2s"}}>{t.icon}</span>
            <span style={{fontSize:9.5,fontWeight:on?700:500,color:on?T.gold:T.sub,fontFamily:"Sora,sans-serif"}}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ── SCREEN 2: DASHBOARD ──
